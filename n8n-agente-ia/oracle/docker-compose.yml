# n8n + Caddy (HTTPS automático) para un servidor con IP pública.
# Requiere un archivo .env en esta carpeta (copiar desde .env.example).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=${DOMINIO}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${DOMINIO}/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=${ZONA_HORARIA}
      - TZ=${ZONA_HORARIA}
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    # Sin "ports": n8n solo es accesible a través de Caddy.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMINIO=${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
